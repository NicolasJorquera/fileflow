name: platform_files
description: File plumbing for FileFlow on Android (SAF, Photo Picker, streamed copies, sharing, incoming "Share" intents, native JPEG). iOS in 2.0.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.nicolasjorquera.platform_files
        pluginClass: PlatformFilesPlugin
      ios:
        pluginClass: PlatformFilesPlugin
