name: Publish to Play

# Same pattern as Trainloop, Ludixa, TakeSync and Flixer (docs/release.md › "Automatic publishing"):
# - merge to main → signed prod AAB to the internal track;
# - v* tag        → the track in the PLAY_TAG_TRACK variable, closed testing ("alpha") by default,
#                   because FileFlow has no production access yet (12 testers × 14 days first);
#                   set PLAY_TAG_TRACK=production afterwards and tags roll out to 20 % of users;
# - manual run    → whichever track and status are picked in Actions.
# Signing and the service account come from the `play-store` environment. AdMob IDs are already
# in the prod flavor (android/app/build.gradle.kts and lib/data/ads).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status (draft leaves the release unpublished in Play Console)"
        type: choice
        options: [completed, inProgress, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: play-store
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.gonisoma.fileflow
  PUB_HOSTED_URL: https://pub.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: play-store
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      # versionName comes from pubspec.yaml (a v* tag must match it). versionCode is the run number
      # plus an offset, so it always grows and stays above the code uploaded by hand (1 was 1.0.0).
      - name: Version, track and status
        id: version
        env:
          OFFSET: ${{ vars.VERSION_CODE_OFFSET || '100' }}
          TAG_TRACK: ${{ vars.PLAY_TAG_TRACK || 'alpha' }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          raw="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          name="${raw%%+*}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version: $raw in pubspec.yaml."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            track="$INPUT_TRACK"; status="$INPUT_STATUS"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            track="$TAG_TRACK"
            [[ "$track" == "production" ]] && status="inProgress" || status="completed"
          else
            track="internal"; status="completed"
          fi
          code=$(( GITHUB_RUN_NUMBER + OFFSET ))
          {
            echo "name=$name"
            echo "code=$code"
            echo "track=$track"
            echo "status=$status"
          } >> "$GITHUB_OUTPUT"
          echo "FileFlow $name ($code) → $track, $status"

      # android/app/build.gradle.kts reads the upload key from android/key.properties.
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing in the play-store environment: ${missing[*]}"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Tests
        timeout-minutes: 15
        run: flutter test

      - name: Signed app bundle
        run: |
          flutter build appbundle --release --flavor prod -t lib/main.dart \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      # Without the upload key Gradle signs with the debug key: that AAB must never reach Play.
      - name: Check the signature
        run: |
          aab=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          jarsigner -verify "$aab" | grep -q "jar verified"
          if keytool -printcert -jarfile "$aab" | grep -q "CN=Android Debug"; then
            echo "::error::The AAB is signed with the debug key."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fileflow-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            build/app/outputs/bundle/prodRelease/app-prod-release.aab
            build/app/outputs/mapping/prodRelease/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Upload to Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          mappingFile: build/app/outputs/mapping/prodRelease/mapping.txt
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          tracks: ${{ steps.version.outputs.track }}
          status: ${{ steps.version.outputs.status }}
          userFraction: ${{ steps.version.outputs.status == 'inProgress' && '0.2' || '' }}

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/key.properties
